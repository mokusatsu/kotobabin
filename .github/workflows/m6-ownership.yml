name: M6 native ownership recovery audit
on:
  workflow_dispatch:
  push:
    branches: [fix/m6-ownership-takeover]
permissions:
  contents: read
concurrency:
  group: m6-ownership-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  ownership:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config=playwright.ownership.config.ts --grep='a second tab is read-only' --repeat-each=12 --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-ownership-${{ matrix.browser }}
          path: test-results/ownership/
