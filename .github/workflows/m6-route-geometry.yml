name: M6 delivery route geometry
on:
  push:
    branches: [fix/m6-route-geometry, feat/m6-final-validation, feat/m5-remaining-art, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-route:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --config=playwright.route-geometry.config.ts --browser=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m6-route-geometry-${{ matrix.browser }}
          path: test-results/route-geometry/
