<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 130" width="160" height="130">
  <!-- Soft ground contact shadow -->
  <ellipse cx="80" cy="112" rx="56" ry="12" fill="rgba(54, 48, 36, 0.22)"/>

  <!-- Stone foundation -->
  <polygon points="30,90 80,112 130,90 80,70" fill="#CFC6B4" stroke="#5A4A3A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="30,90 80,112 80,118 30,96" fill="#A99F8D" stroke="#5A4A3A" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="80,112 130,90 130,96 80,118" fill="#8E8473" stroke="#5A4A3A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Timber & plaster cottage walls -->
  <polygon points="36,56 80,76 80,108 36,88" fill="#F4EAD2" stroke="#5A4A3A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="80,76 124,56 124,88 80,108" fill="#E0D0B0" stroke="#5A4A3A" stroke-width="2" stroke-linejoin="round"/>

  <!-- Warm glowing arched & framed windows -->
  <rect x="46" y="68" width="16" height="18" rx="3" transform="skewY(22)" fill="#FFE699" stroke="#5A4A3A" stroke-width="1.6"/>
  <rect x="92" y="102" width="18" height="15" rx="2" transform="skewY(-22)" fill="#FFE699" stroke="#5A4A3A" stroke-width="1.6"/>
  <!-- Door -->
  <polygon points="62,82 74,87 74,105 62,100" fill="#8C5E3C" stroke="#5A4A3A" stroke-width="1.6"/>

  <!-- Slate-blue pitched roof -->
  <polygon points="24,58 80,22 136,58 80,82" fill="#5B788E" stroke="#454A52" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="24,58 80,22 80,50" fill="#6F8EA5" stroke="#454A52" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Observatory dormer skylight -->
  <polygon points="74,34 92,26 106,36 88,44" fill="#4B667A" stroke="#454A52" stroke-width="1.6" stroke-linejoin="round"/>
  <polygon points="74,34 88,44 88,52 74,42" fill="#FFF2B8" stroke="#5A4A3A" stroke-width="1.5"/>

  <!-- Brass weathervane on roof peak -->
  <line x1="80" y1="22" x2="80" y2="7" stroke="#5A4A3A" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="71" y1="12" x2="89" y2="12" stroke="#D49B35" stroke-width="2" stroke-linecap="round"/>
  <polygon points="89,12 84,9 84,15" fill="#D49B35"/>
  <circle cx="80" cy="12" r="2.2" fill="#E8B84B" stroke="#5A4A3A" stroke-width="1"/>

  <!-- Bush accent -->
  <circle cx="34" cy="90" r="7" fill="#7CA365" stroke="#4E6B3D" stroke-width="1.4"/>
  <circle cx="126" cy="88" r="6" fill="#7CA365" stroke="#4E6B3D" stroke-width="1.4"/>
</svg>
