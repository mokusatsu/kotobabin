<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 130" width="160" height="130">
  <!-- Soft ground contact shadow -->
  <ellipse cx="80" cy="112" rx="54" ry="11" fill="rgba(54, 48, 36, 0.22)"/>

  <!-- Cobblestone relay plaza base -->
  <polygon points="30,90 80,112 130,90 80,70" fill="#DED4BE" stroke="#5A4A3A" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="30,90 80,112 80,117 30,95" fill="#BEB197" stroke="#5A4A3A" stroke-width="1.8" stroke-linejoin="round"/>
  <polygon points="80,112 130,90 130,95 80,117" fill="#A5977D" stroke="#5A4A3A" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Relay kiosk posts & timber frame -->
  <line x1="48" y1="54" x2="48" y2="92" stroke="#6E4E32" stroke-width="4" stroke-linecap="round"/>
  <line x1="80" y1="68" x2="80" y2="104" stroke="#6E4E32" stroke-width="4" stroke-linecap="round"/>
  <line x1="112" y1="54" x2="112" y2="92" stroke="#6E4E32" stroke-width="4" stroke-linecap="round"/>

  <!-- Community noticeboard with colorful postcards -->
  <polygon points="52,58 108,58 108,82 52,82" fill="#C99B66" stroke="#5A4A3A" stroke-width="1.8" stroke-linejoin="round"/>
  <rect x="57" y="63" width="13" height="12" rx="1" fill="#FFFDF7" stroke="#7A6855" stroke-width="1"/>
  <rect x="74" y="62" width="13" height="13" rx="1" fill="#FBE5B8" stroke="#7A6855" stroke-width="1"/>
  <rect x="91" y="64" width="12" height="11" rx="1" fill="#E3F0EA" stroke="#7A6855" stroke-width="1"/>

  <!-- Pitched sage-green wooden pavilion roof -->
  <polygon points="32,56 80,26 128,56 80,70" fill="#5E8B78" stroke="#3F594E" stroke-width="2.2" stroke-linejoin="round"/>
  <polygon points="32,56 80,26 80,46" fill="#73A18D" stroke="#3F594E" stroke-width="1.8" stroke-linejoin="round"/>

  <!-- Classic red Japanese round postbox beside pavilion -->
  <rect x="35" y="76" width="10" height="16" rx="4" fill="#D1493B" stroke="#5A4A3A" stroke-width="1.5"/>
  <circle cx="40" cy="76" r="5" fill="#DF584A" stroke="#5A4A3A" stroke-width="1.5"/>
  <line x1="37" y1="77" x2="43" y2="77" stroke="#421B17" stroke-width="1.6"/>

  <!-- Wooden bench on right -->
  <polygon points="94,88 114,80 120,83 100,91" fill="#C88D55" stroke="#5A4A3A" stroke-width="1.4"/>
  <line x1="97" y1="90" x2="97" y2="97" stroke="#6E4E32" stroke-width="2.2"/>
  <line x1="115" y1="82" x2="115" y2="89" stroke="#6E4E32" stroke-width="2.2"/>
</svg>
